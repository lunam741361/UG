function stateOf(keys){var n=keys.filter(function(k){return st.fsel[k];}).length;return n===keys.length?'on':n?'half':'';}
function mark(s){return s==='on'?'✓':s==='half'?'–':'';}

function render(){
  var list=filtered(),total=isFiltering()?list.length:831;
  var selN=Object.keys(st.sel).filter(function(k){return st.sel[k];}).length;
  var selCount=st.allResults?total:selN;
  var pageAll=list.length>0&&list.every(function(m){return st.sel[m.id];});
  var h='<main>';
  h+='<div class="row"><select class="ipt" style="width:150px" data-f="cur" aria-label="币种">'+opts(CURRENCIES,st.cur)+'</select>';
  h+='<div class="row"><button class="btn btnp" type="button">+ 新增会员</button><button class="btn" type="button">导入 ▾</button>';
  h+='<div class="dd"><button class="btn" type="button" data-act="menu" aria-haspopup="true" aria-expanded="'+st.menuOpen+'">导出报表 ▾</button>';
  if(st.menuOpen)h+='<div class="menu" role="menu"><button type="button" role="menuitem" data-act="exp-sel">导出选中数据</button><button type="button" role="menuitem" data-act="exp-flt">导出筛选结果</button></div>';
  h+='</div><a href="#" style="margin-left:4px">操作教程</a></div></div>';

  h+='<div class="card filters"><select class="ipt" style="width:120px" data-f="timeType" aria-label="时间维度">'+opts(TIMETYPES,st.timeType)+'</select>';
  h+='<div style="display:flex"><button type="button" class="seg'+(st.seg==='D'?' on':'')+'" data-act="seg" data-v="D">日</button><button type="button" class="seg'+(st.seg==='W'?' on':'')+'" data-act="seg" data-v="W">周</button><button type="button" class="seg'+(st.seg==='M'?' on':'')+'" data-act="seg" data-v="M">月</button></div>';
  h+='<div class="daterange"><input type="date" aria-label="开始日期" data-f="start" value="'+st.start+'"><span style="color:#909399">至</span><input type="date" aria-label="结束日期" data-f="end" value="'+st.end+'"></div>';
  h+='<select class="ipt" style="width:150px" data-f="cond" aria-label="搜索条件"><option value="">请选择搜索条件</option>'+opts(Object.keys(COND_VALS),st.cond)+'</select>';
  if(st.cond)h+='<select class="ipt" style="width:160px" data-f="condVal" aria-label="'+st.cond+'"><option value="">请选择'+st.cond+'</option>'+opts(COND_VALS[st.cond],st.condVal)+'</select>';
  h+='<select class="ipt" style="width:150px" data-f="stype" aria-label="搜索类型">'+opts(STYPES,st.stype)+'</select>';
  h+='<input class="ipt" style="width:170px" data-f="kw" aria-label="搜索值" placeholder="请输入'+esc(st.stype)+'" value="'+esc(st.kw)+'">';
  h+='<button class="btn btnp" type="button" data-act="search">搜索</button><button class="btn btnp" type="button">高级搜索</button><button class="btn" type="button" data-act="reset">重置</button></div>';

  h+='<div class="card tbl"><table class="list"><thead><tr>';
  h+='<th class="th fixl" style="left:0;width:36px"><input type="checkbox" aria-label="全选当前页" data-act="page"'+(pageAll?' checked':'')+'></th>';
  h+='<th class="th fixl" style="left:56px;width:120px">会员ID</th><th class="th fixl shl" style="left:196px;width:160px">会员账号(层级)</th>';
  h+='<th class="th">账号状态</th><th class="th">账号类型(会员级别)</th><th class="th">姓名</th><th class="th new newh">邀请人(ID)</th><th class="th">顶层代理(ID)</th><th class="th">上级代理(ID)</th><th class="th">币种</th>';
  h+='<th class="th">总余额(含利息宝) ⇅</th><th class="th">总充值金额 ⇅<small>(充值次数)</small></th><th class="th">总提现金额 ⇅<small>(提现次数)</small></th><th class="th">总充提差额 ⇅<small>(首充金额)</small></th>';
  h+='<th class="th">注册方式<small>(验证方式)</small></th><th class="th">注册时间 ⇅<small>(来源)</small></th><th class="th">登录方式</th><th class="th">注册设备系统 ⇅</th><th class="th">最后登录IP/地区最后登录时间</th><th class="th fixr" style="width:90px">操作</th></tr></thead><tbody>';
  list.forEach(function(m){
    var checked=st.sel[m.id]||st.allResults;
    h+='<tr><td class="td fixl" style="left:0"><input type="checkbox" aria-label="选择 '+m.acct+'" data-act="row" data-id="'+m.id+'"'+(checked?' checked':'')+'></td>';
    h+='<td class="td fixl" style="left:56px;text-align:left"><span class="v0">V0</span><div><button type="button" class="lnk" style="font-size:14px" data-act="open" data-id="'+m.id+'">'+m.id+'</button>'+CP+'</div></td>';
    h+='<td class="td fixl shl" style="left:196px;white-space:normal;max-width:160px"><button type="button" class="lnk" style="font-size:14px" data-act="open" data-id="'+m.id+'">'+m.acct+'</button>'+CP+'<div class="sub">(预设层级)</div>'+(m.tags?TAGS:'')+'</td>';
    h+='<td class="td"><span class="ok">正常</span></td><td class="td">正式账号<div class="sub">(VIP0)</div></td><td class="td">--</td>';
    h+='<td class="td new newc">'+agent(m.inv)+'</td><td class="td">'+agent(m.top)+'</td><td class="td">'+agent(m.up)+'</td><td class="td">CNY</td>';
    h+='<td class="td" style="text-align:right">'+m.bal+'</td><td class="td" style="color:#67c23a">0.00<span class="sub">(0)</span></td><td class="td" style="color:#67c23a">0.00<span class="sub">(0)</span></td><td class="td">0.00<div>0.00</div></td>';
    h+='<td class="td">'+m.way+'<div class="sub">(密码)</div></td><td class="td">'+m.time+'<div class="sub">'+m.src+'</div></td><td class="td">'+m.login+'</td><td class="td">其他</td>';
    h+='<td class="td">'+m.ip+'<div class="sub">'+m.area+'</div><div class="sub">'+m.last+'</div></td><td class="td fixr"><button type="button" class="lnk" data-act="open" data-id="'+m.id+'">详情</button></td></tr>';
  });
  if(!list.length)h+='<tr><td class="td" colspan="20" style="color:#909399;padding:40px 0 40px 600px;text-align:left">暂无数据</td></tr>';
  h+='</tbody></table></div>';

  h+='<div class="card foot"><div class="l"><label><input type="checkbox" data-act="page"'+(pageAll?' checked':'')+'> 全选当前页</label><label><input type="checkbox" data-act="allres"'+(st.allResults?' checked':'')+'> 全选所有结果</label>';
  h+='<select class="ipt" style="width:150px" aria-label="批量操作"><option>批量操作</option>'+opts(BATCH,'')+'</select><span>已选择 '+selCount+' 条数据</span><button class="btn" type="button" data-act="exp-sel">导出报表</button></div>';
  h+='<div class="r"><span class="pg" style="color:#c0c4cc">‹</span><span class="pg on">1</span><span class="pg">2</span><span class="pg">3</span><span class="pg">4</span><span class="pg">5</span><span class="pg">6</span><span class="pg">…</span><span class="pg">9</span><span class="pg">›</span>';
  h+='<span style="margin-left:16px">前往</span><input class="ipt" aria-label="页码" value="1" style="width:56px;text-align:center"><span>页</span><span style="margin-left:12px">共 '+total+' 条</span>';
  h+='<select class="ipt" style="width:120px" aria-label="每页条数"><option>20条/页</option><option>50条/页</option><option selected>100条/页</option><option>200条/页</option><option>500条/页</option></select></div></div>';
  h+='</main>';

  if(st.dlg){
    var fCount=ALLKEYS.filter(function(k){return st.fsel[k];}).length,as=stateOf(ALLKEYS);
    var needSec=ALLKEYS.some(function(k){return st.fsel[k]&&k.indexOf('安全码')>=0;});
    var okDis=!(fCount>0&&(!needSec||st.sec.trim()!==''));
    h+='<div class="mask" data-act="mask"><div class="dlg" role="dialog" aria-modal="true"><div class="dlg-h"><span>'+(st.dlg==='selected'?'导出选中数据':'导出筛选结果')+'</span><button type="button" class="lnk" aria-label="关闭" style="color:#909399;font-size:20px" data-act="close-dlg">×</button></div><div class="dlg-b">';
    h+='<div class="allrow"><button type="button" class="ck '+as+'" data-act="f-all"><span class="box">'+mark(as)+'</span>全选</button><span style="color:#909399">已选 '+fCount+' / '+ALLKEYS.length+' 项</span></div>';
    GROUPS.forEach(function(g,gi){
      var keys=g.items.map(function(it){return gi+':'+it;}),gs=stateOf(keys);
      h+='<div style="margin-bottom:20px"><div style="margin-bottom:12px"><button type="button" class="ck '+gs+'" data-act="f-grp" data-g="'+gi+'"><span class="box">'+mark(gs)+'</span>'+g.name+'<span class="cnt">（'+g.items.length+'个）</span></button></div><div class="grid">';
      g.items.forEach(function(it){var k=gi+':'+it,on=!!st.fsel[k];
        h+='<div><button type="button" class="ck'+(on?' on':'')+'" data-act="f-item" data-k="'+esc(k)+'"><span class="box">'+(on?'✓':'')+'</span><span>'+it+(k===NEWKEY?'<span class="nb">新增</span>':'')+'</span></button></div>';});
      h+='</div></div>';
    });
    if(needSec)h+='<div style="display:flex;align-items:center;gap:12px;padding:10px 0 0"><label for="sec" style="width:56px;text-align:right;color:#606266;flex:none"><span style="color:#f56c6c">*</span> 安全码</label><input id="sec" class="ipt" style="flex:1" placeholder="请输入安全码" autocomplete="off" data-f="sec" value="'+esc(st.sec)+'"></div><div style="color:#f56c6c;padding:6px 0 10px 68px;font-size:12px">所选字段包含敏感信息，需要输入安全码才能解密，请慎重导出。</div>';
    h+='</div><div class="dlg-f"><button class="btn" type="button" data-act="close-dlg">取消</button><button class="btn btnp" type="button" id="okbtn" data-act="confirm"'+(okDis?' disabled':'')+'>确定导出</button></div></div></div>';
  }

  var dm=st.detail?find(st.detail):null;
  if(dm){
    h+='<div class="mask" data-act="mask"><section class="det" role="dialog" aria-modal="true" aria-label="会员详情"><div class="det-h"><div class="info"><span>币种：<strong>CNY</strong></span><span>会员账号：<strong>'+dm.acct+'</strong> <button type="button" class="cpbtn">复制</button></span><span>会员ID：<strong>'+dm.id+'</strong> <button type="button" class="cpbtn">复制</button></span></div><button type="button" class="lnk" aria-label="关闭" style="font-size:20px;color:#909399" data-act="close-det">×</button></div>';
    h+='<div class="tabs">'+TABS.map(function(t){return '<button type="button" class="dtab'+(t===st.dtab?' on':'')+'" data-act="tab" data-v="'+t+'">'+t+'</button>';}).join('')+'</div>';
    if(st.dtab==='会员概览'){
      var inv=dm.inv?'<button type="button" class="lnk" data-act="open" data-id="'+dm.inv[1]+'">'+dm.inv[0]+'</button> <span class="sub">('+dm.inv[1]+')</span>':'-';
      var up=dm.up?'<button type="button" class="lnk" data-act="open" data-id="'+dm.up[1]+'">'+dm.up[0]+'</button> <span class="sub">('+dm.up[1]+')</span><a class="op" href="#">修改</a><a class="op" href="#" style="color:#f56c6c">解除</a>':'-<a class="op" href="#">修改</a>';
      h+='<div style="padding:20px"><table class="ov"><tbody>';
      h+='<tr><td class="lb">账号状态</td><td class="vl"><span style="color:#67c23a">正常</span><a class="op" href="#">修改状态</a></td></tr>';
      h+='<tr><td class="lb">账号类型</td><td class="vl">正式账号</td></tr>';
      h+='<tr><td class="lb">会员层级</td><td class="vl">预设层级<a class="op" href="#">修改层级</a></td></tr>';
      h+='<tr><td class="lb">VIP等级</td><td class="vl"><span class="v0">V0</span><a class="op" href="#">修改VIP等级</a></td></tr>';
      h+='<tr><td class="lb">会员标签</td><td class="vl">'+(dm.tags?'已使用过钱包提现用户、测试、首存、好人、坏人':'无')+'<a class="op" href="#">修改标签</a></td></tr>';
      h+='<tr><td class="lb">总余额</td><td class="vl">'+dm.bal+'<a class="op" href="#">账变记录</a><a class="op" href="#">手动加款</a><a class="op" href="#">手动扣除</a></td></tr>';
      h+='<tr><td class="lb">注册时间</td><td class="vl">'+dm.time+' <span class="sub">('+dm.src+')</span></td></tr>';
      h+='<tr class="hl"><td class="lb">邀请人<button type="button" class="tip" title="会员账号创建时的上级代理（推广注册、代理开户、渠道链接、后台新增、导入）。账号创建后固定不变，之后修改、解除或新加上级代理都不影响邀请人。" aria-label="邀请人说明">?</button></td><td class="vl">'+inv+'</td></tr>';
      h+='<tr><td class="lb">上级代理</td><td class="vl">'+up+'</td></tr>';
      h+='<tr><td class="lb">代理佣金</td><td class="vl">累计佣金 0.00<a class="op" href="#">佣金管理</a></td></tr>';
      h+='<tr><td class="lb">最后登录</td><td class="vl">'+dm.ip+' / '+dm.area+' <span class="sub">'+dm.last+'</span></td></tr>';
      h+='<tr><td class="lb">登录方式</td><td class="vl">'+dm.login+'</td></tr>';
      h+='<tr><td class="lb">备注</td><td class="vl">无<a class="op" href="#">修改备注</a></td></tr>';
      h+='</tbody></table></div>';
    } else {
      h+='<div style="padding:80px 20px;text-align:center;color:#909399;font-size:16px">'+st.dtab+'</div>';
    }
    h+='</section></div>';
  }
  document.getElementById('app').innerHTML=h;
}

var toastTimer;
function toast(msg,type){
  var t=document.querySelector('.toast');
  if(!t){t=document.createElement('div');document.body.appendChild(t);}
  t.className='toast '+type;t.setAttribute('role','status');t.textContent=msg;t.style.display='block';
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.style.display='none';},2600);
}
function openExport(mode){
  var total=isFiltering()?filtered().length:831;
  var selN=Object.keys(st.sel).filter(function(k){return st.sel[k];}).length;
  var selCount=st.allResults?total:selN;
  st.menuOpen=false;
  if(mode==='selected'&&!selCount){render();toast('请先勾选要导出的会员','warn');return;}
  st.dlg=mode;st.fsel=allSel();st.sec='';render();
}

var app=document.getElementById('app');
app.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el){if(st.menuOpen){st.menuOpen=false;render();}return;}
  var act=el.dataset.act;
  if(act==='mask'){if(e.target===el){st.dlg='';st.detail='';render();}return;}
  if(act!=='menu'&&act!=='exp-sel'&&act!=='exp-flt'&&st.menuOpen){st.menuOpen=false;}
  switch(act){
    case 'menu':st.menuOpen=!st.menuOpen;render();break;
    case 'exp-sel':openExport('selected');break;
    case 'exp-flt':openExport('filtered');break;
    case 'seg':var v=el.dataset.v;st.seg=v;st.start=v==='D'?TODAY:v==='W'?'2026-11-02':'2026-11-01';st.end=TODAY;render();break;
    case 'search':var a={};Object.keys(blank()).forEach(function(k){a[k]=st[k];});st.applied=a;st.sel={};st.allResults=false;render();break;
    case 'reset':Object.assign(st,blank(),{applied:blank(),sel:{},allResults:false});render();break;
    case 'row':st.sel[el.dataset.id]=!st.sel[el.dataset.id];st.allResults=false;render();break;
    case 'page':var list=filtered(),all=list.length>0&&list.every(function(m){return st.sel[m.id];});list.forEach(function(m){st.sel[m.id]=!all;});st.allResults=false;render();break;
    case 'allres':st.allResults=!st.allResults;render();break;
    case 'open':st.detail=el.dataset.id;st.dtab='会员概览';render();break;
    case 'close-det':st.detail='';render();break;
    case 'tab':st.dtab=el.dataset.v;render();break;
    case 'close-dlg':st.dlg='';render();break;
    case 'f-all':var n=ALLKEYS.filter(function(k){return st.fsel[k];}).length;st.fsel=n===ALLKEYS.length?{}:allSel();render();break;
    case 'f-grp':var gi=+el.dataset.g,keys=GROUPS[gi].items.map(function(it){return gi+':'+it;}),full=keys.every(function(k){return st.fsel[k];});keys.forEach(function(k){st.fsel[k]=!full;});render();break;
    case 'f-item':st.fsel[el.dataset.k]=!st.fsel[el.dataset.k];render();break;
    case 'confirm':st.dlg='';render();toast('导出任务已提交，请到「下载中心」查看','ok');break;
    default:render();
  }
});
app.addEventListener('change',function(e){
  var f=e.target.dataset.f;if(!f||f==='kw'||f==='sec')return;
  st[f]=e.target.value;
  if(f==='start'||f==='end')st.seg='';
  if(f==='cond')st.condVal='';
  render();
});
app.addEventListener('input',function(e){
  var f=e.target.dataset.f;
  if(f==='kw'){st.kw=e.target.value;var ph=e.target;ph.placeholder='请输入'+st.stype;}
  if(f==='sec'){st.sec=e.target.value;var ok=document.getElementById('okbtn');var fCount=ALLKEYS.filter(function(k){return st.fsel[k];}).length;ok.disabled=!(fCount>0&&st.sec.trim()!=='');}
});
app.addEventListener('keydown',function(e){if(e.target.dataset.f==='kw'&&e.key==='Enter'){e.preventDefault();app.querySelector('[data-act="search"]').click();}});
render();
</script>
